<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dark Chat</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#04060a;
      --panel: rgba(255,255,255,0.03);
      --glass: rgba(255,255,255,0.02);
      --neon:#00ff9d;
      --cyan:#00e5ff;
      --purple:#9b7bff;
      --text:#e6f7ff;
      --muted:#88a6b8;
      --radius:14px;
      --glow: 0 8px 40px rgba(0,255,157,0.08);
      --glass-blur:10px;
      font-family: 'Inter', system-ui, -apple-system, Roboto, sans-serif;
    }

    *{box-sizing:border-box}
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(155,123,255,0.06), transparent 10%),
        radial-gradient(800px 500px at 90% 80%, rgba(0,229,255,0.04), transparent 10%),
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
    }

    .glass{
      backdrop-filter: blur(var(--glass-blur));
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
      border: 1px solid rgba(255,255,255,0.03);
      box-shadow: var(--glow);
    }

    /* Topbar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .brand img {
      height: 42px;
      width: auto;
      object-fit: contain;
      border-radius: 6px;
    }
    .status{color:var(--muted); font-weight: 600;}

    /* Main Layout */
    .main {
      display: flex;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Left Panel */
    .left-panel {
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .profile { display: flex; gap: 10px; align-items: center; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
      border: 1px solid rgba(255,255,255,0.03); font-weight: 700;
    }
    .avatar.large{ width:80px; height:80px; font-size:20px }
    .meta .name{ font-weight:600 }
    .meta .sub{ font-size:12px; color:var(--muted) }

    .controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .icon-btn { background: transparent; border: none; color: var(--neon); cursor: pointer; padding: 6px; font-size: 18px; }
    .btn { padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); background: transparent; color: var(--text); cursor: pointer; font-size: 13px;}
    .btn.small { padding: 6px 10px; }
    .btn.neon { background: linear-gradient(90deg,var(--neon),var(--cyan)); color: #001018; font-weight: 700; }
    .btn.danger { background: linear-gradient(90deg,#ff5b6f,#ea0038); color: #fff; }

    /* Snap Area */
    .snap-area { display: flex; flex-direction: column; gap: 6px; padding: 8px; align-items: center; }
    #snapVideo { width: 100%; height: 120px; border-radius: 8px; background: #000; object-fit: cover; }
    #snapCanvas { width: 100%; border-radius: 8px; }

    /* Center (Chat Section with Custom Background) */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      padding: 8px;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      min-height: 0;

      /* GitHub bg.jpeg set as dynamic background */
      background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('bg.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 10px;
    }
    .chat-box:empty::before {
      content: attr(data-empty);
      color: var(--muted);
      position: absolute; left: 50%; top: 48%;
      transform: translate(-50%,-50%); opacity: 0.7;
    }

    /* Messages Style */
    .msg {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.05);
      word-break: break-word;
    }
    .msg.left {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.75);
    }
    .msg.right {
      align-self: flex-end;
      background: rgba(0, 255, 157, 0.18);
      border: 1px solid rgba(0,255,157,0.3);
    }
    .msg img { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; }
    .msg .meta { font-size: 10px; color: var(--muted); margin-bottom: 2px; }

    /* Composer */
    .composer {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 6px;
      border-top: 1px solid rgba(255,255,255,0.02);
      flex-shrink: 0;
      position: relative;
    }
    #messageInput {
      flex: 1;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.4);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    /* Emoji Picker Styling */
    #emojiPickerContainer {
      position: absolute;
      bottom: 55px;
      left: 10px;
      z-index: 100;
      display: none;
    }
    #emojiPickerContainer.active {
      display: block;
    }

    /* Overlays */
    .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 60; background: rgba(0,0,0,0.85); }
    .overlay.hidden { display: none !important; }

    /* Full-screen WhatsApp-style call screen */
    #callOverlay {
      background: #000;
      padding: 0;
    }
    .call-card {
      width: 100%;
      height: 100%;
      max-width: none;
      padding: 0;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      background: radial-gradient(1200px 800px at 50% 0%, rgba(0,255,157,0.05), transparent 60%), #05070a;
      position: relative;
      overflow: hidden;
    }

    /* Remote video fills the entire screen (like WhatsApp) */
    .call-videos {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 0;
      overflow: hidden;
    }
    .call-videos video { width: 100%; height: 100%; object-fit: cover; }
    #remoteVideo:not([src]), #remoteVideo.no-stream { opacity: 0; }

    /* Small local preview, WhatsApp-style, top-right */
    .call-videos .local {
      position: absolute;
      right: 14px;
      top: 14px;
      bottom: auto;
      width: 96px;
      height: 140px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.25);
      background: #111;
      z-index: 3;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }

    /* Top header: avatar + name + status, overlaid on the video */
    .call-header {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 48px 16px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.0));
      text-align: center;
    }
    .call-header .avatar.large {
      width: 96px; height: 96px; font-size: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,0,0,0.2));
    }
    #callName { font-size: 20px; }
    #callState { font-size: 14px; margin-top: 2px; }

    /* Bottom control bar, fixed like WhatsApp */
    .call-actions {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      display: flex;
      gap: 22px;
      justify-content: center;
      align-items: center;
      padding: 22px 16px calc(24px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(0,0,0,0.6), rgba(0,0,0,0.0));
    }
    .ctrl {
      width: 58px; height: 58px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: var(--text);
      cursor: pointer;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .ctrl.active { background: rgba(255,255,255,0.3); }
    .ctrl.danger { background: #ff3040; color: #fff; }

    @media (max-width: 480px) {
      .call-videos .local { width: 78px; height: 112px; right: 10px; top: 10px; }
      .call-header { padding-top: 40px; }
      .ctrl { width: 52px; height: 52px; font-size: 20px; }
      .call-actions { gap: 16px; }
    }

    #incoming { background: linear-gradient(180deg, #0b1220, #04060a); }
    .incoming-card {
      width: 100%; height: 100%;
      padding: 60px 20px calc(40px + env(safe-area-inset-bottom));
      border-radius: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .incoming-caller { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .incoming-caller .avatar.large { width: 110px; height: 110px; font-size: 34px; }
    .incoming-actions { display: flex; gap: 40px; justify-content: center; width: 100%; }
    .incoming-actions .ctrl { width: 62px; height: 62px; font-size: 24px; }
    .incoming-actions .label { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .incoming-btn-wrap { display: flex; flex-direction: column; align-items: center; }

    /* More menu */
    .more-wrap { position: relative; }
    .more-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      min-width: 160px;
      background: #0b1220;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 6px;
      z-index: 40;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .more-menu.active { display: block; }
    .more-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    .more-menu-item:hover { background: rgba(255,255,255,0.06); }

    /* Games full-screen overlay */
    #gamesOverlay { background: rgba(2,4,8,0.97); }
    .games-card {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(1000px 600px at 50% 0%, rgba(0,229,255,0.05), transparent 60%), #05070a;
    }
    .games-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .games-topbar #gamesTitle { font-weight: 700; font-size: 16px; }
    .back-btn { display: none; }
    .back-btn.show { display: inline-flex; }
    .games-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .game-screen { display: none; }
    .game-screen.active { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #gameLauncher.active { display: block; }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      max-width: 720px;
      margin: 0 auto;
    }
    .game-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 22px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.1));
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }
    .game-tile:hover { border-color: rgba(0,255,157,0.4); transform: translateY(-2px); }
    .game-tile .emoji { font-size: 30px; }

    /* Tic Tac Toe */
    .ttt-board {
      display: grid;
      grid-template-columns: repeat(3, 84px);
      grid-template-rows: repeat(3, 84px);
      gap: 6px;
    }
    .ttt-cell {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      cursor: pointer;
      color: var(--neon);
    }
    .ttt-cell.o { color: var(--cyan); }
    .ttt-cell:hover { background: rgba(255,255,255,0.08); }
    .game-status { font-size: 14px; color: var(--muted); text-align: center; }
    .game-actions { display: flex; gap: 8px; }

    /* Rock Paper Scissors */
    .rps-choices { display: flex; gap: 14px; }
    .rps-choice {
      width: 68px; height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      font-size: 28px;
      cursor: pointer;
    }
    .rps-choice:hover { border-color: var(--neon); }
    .rps-choice:disabled { opacity: 0.4; cursor: default; }
    .rps-result { display: flex; gap: 30px; align-items: center; font-size: 40px; min-height: 60px; }
    .rps-vs { color: var(--muted); font-size: 14px; text-align: center; }

    /* Mobile Specific Layout Fixes */
    @media (max-width: 768px) {
      .main {
        flex-direction: column;
        gap: 6px;
      }
      .left-panel {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        gap: 6px;
      }
      .controls { flex-wrap: nowrap; }
      .snap-area {
        position: fixed;
        top: 60px;
        left: 8px;
        right: 8px;
        z-index: 50;
        background: #000;
      }
      .chat-box { padding: 8px; }
      #emojiPickerContainer {
        left: 0;
        right: 0;
        bottom: 60px;
      }
      .ttt-board { grid-template-columns: repeat(3, 26vw); grid-template-rows: repeat(3, 26vw); }
      .ttt-cell { font-size: 8vw; }
      .games-body { padding: 14px; }
    }
  </style>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/picmo@5.8.5/dist/umd/index.js"></script>
  <script src="utils.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar glass">
      <div class="brand">
        <img src="https://cdn.creativefabrica.com/2019/02/Monogram-BS-Logo-by-Greenlines-Studios.jpg" alt="Logo">
        <span>Dark Chat</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div id="status" class="status">connecting...</div>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌓</button>
      </div>
    </header>

    <main class="main">
      <aside class="left-panel glass">
        <div class="profile">
          <div id="myAvatar" class="avatar">Y</div>
          <div class="meta">
            <div id="myName" class="name">You</div>
            <div id="myStatus" class="sub">Online: 1</div>
          </div>
        </div>

        <div class="controls">
          <button id="openSnap" class="btn small neon">Snap</button>
          <input id="fileInput" type="file" accept="image/*,audio/*,video/*,*/*" hidden>
          <button id="attach" class="btn small">Attach</button>
          <button id="startCallBtn" class="btn small neon">Call</button>
          <div class="more-wrap">
            <button id="moreBtn" class="btn small">⋯ More</button>
            <div id="moreMenu" class="more-menu">
              <button id="openGamesBtn" class="more-menu-item">🎮 Games</button>
            </div>
          </div>
        </div>

        <div class="snap-area glass" id="snapArea" style="display:none;">
          <div style="font-weight:600; color:var(--muted); font-size:12px;">Snap Camera</div>
          <video id="snapVideo" autoplay muted playsinline></video>
          <canvas id="snapCanvas" hidden></canvas>
          <div style="display: flex; gap: 6px; margin-top: 4px;">
            <button id="captureBtn" class="btn small neon">Capture</button>
            <button id="sendSnapBtn" class="btn small">Send</button>
            <button id="closeSnapBtn" class="btn small danger">Close</button>
          </div>
        </div>
      </aside>

      <section class="center glass">
        <div id="chatBox" class="chat-box" data-empty="No messages yet"></div>

        <div class="composer">
          <div id="emojiPickerContainer"></div>
          <button id="emojiBtn" class="icon-btn" title="Choose Emoji">😊</button>
          <button id="camBtn" class="icon-btn" title="Open Snap">📷</button>
          <input id="messageInput" placeholder="Send a chat..." autocomplete="off" />
          <button id="sendBtn" class="btn neon" title="Send message">➤</button>
        </div>
      </section>
    </main>

    <div id="callOverlay" class="overlay hidden">
      <div class="call-card">
        <div class="call-videos">
          <video id="remoteVideo" autoplay playsinline></video>
          <video id="localVideo" class="local" autoplay muted playsinline></video>
        </div>

        <div class="call-header">
          <div id="callAvatar" class="avatar large">C</div>
          <div>
            <div id="callName" class="name">Peer</div>
            <div id="callState" class="sub">Connecting...</div>
          </div>
        </div>

        <div class="call-actions">
          <button id="muteBtn" class="ctrl" title="Mute">🎙️</button>
          <button id="cameraToggleBtn" class="ctrl" title="Camera">📷</button>
          <button id="hangupBtn" class="ctrl danger" title="Hang up">🛑</button>
        </div>
      </div>
    </div>

    <div id="incoming" class="overlay hidden">
      <div class="incoming-card">
        <div class="incoming-caller">
          <div class="avatar large">C</div>
          <div id="incomingText" style="font-size: 18px; font-weight: 600;">Incoming call...</div>
        </div>
        <div class="incoming-actions">
          <div class="incoming-btn-wrap">
            <button id="declineBtn" class="ctrl danger" title="Decline">📞</button>
            <div class="label">Decline</div>
          </div>
          <div class="incoming-btn-wrap">
            <button id="answerBtn" class="ctrl" style="background: linear-gradient(90deg,var(--neon),var(--cyan)); color:#001018;" title="Answer">📞</button>
            <div class="label">Answer</div>
          </div>
        </div>
      </div>
    </div>

    <div id="gamesOverlay" class="overlay hidden">
      <div class="games-card">
        <div class="games-topbar">
          <button id="gamesBackBtn" class="icon-btn back-btn" title="Back">←</button>
          <div id="gamesTitle">Games</div>
          <button id="gamesCloseBtn" class="icon-btn" title="Close">✕</button>
        </div>
        <div class="games-body">
          <div id="gameLauncher" class="game-screen active">
            <div class="games-grid">
              <button class="game-tile" data-game="ttt-multi"><span class="emoji">❌⭕</span>Tic-Tac-Toe<br><span style="color:var(--muted);font-size:11px;">vs Friend</span></button>
              <button class="game-tile" data-game="rps-multi"><span class="emoji">✊✋✌️</span>Rock Paper Scissors<br><span style="color:var(--muted);font-size:11px;">vs Friend</span></button>
            </div>
          </div>

          <div id="gameTTT" class="game-screen">
            <div id="tttStatus" class="game-status">Your turn (X)</div>
            <div id="tttBoard" class="ttt-board"></div>
            <div class="game-actions"><button id="tttResetBtn" class="btn small neon">Restart</button></div>
          </div>

          <div id="gameRPS" class="game-screen">
            <div id="rpsStatus" class="game-status">Pick your move</div>
            <div id="rpsResult" class="rps-result"></div>
            <div id="rpsChoices" class="rps-choices">
              <button class="rps-choice" data-choice="rock">✊</button>
              <button class="rps-choice" data-choice="paper">✋</button>
              <button class="rps-choice" data-choice="scissors">✌️</button>
            </div>
            <div class="game-actions"><button id="rpsResetBtn" class="btn small neon">Play Again</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const peerConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
        // NOTE: STUN-only works when both people are on open networks.
        // If calls still fail on mobile data / office wifi, add a TURN
        // server here too, e.g.:
        // { urls: 'turn:your-turn-server.com:3478', username: 'user', credential: 'pass' }
      ]
    };

    const {
      byId, setText, showOverlay, hideOverlay, bindDismissablePanel,
      readFileAsDataURL, getMedia, stopStream, toggleTrack
    } = window.DarkChat;

    window.addEventListener('DOMContentLoaded', () => {
      const socket = io("https://dark-chat-backend-2v8y.onrender.com");

      const statusEl = document.getElementById('status');
      const sendBtn = document.getElementById('sendBtn');
      const messageInput = document.getElementById('messageInput');
      const chatBox = document.getElementById('chatBox');
      const fileInput = document.getElementById('fileInput');
      const attachBtn = document.getElementById('attach');
      const startCallBtn = document.getElementById('startCallBtn');
      const camBtn = document.getElementById('camBtn');
      const emojiBtn = document.getElementById('emojiBtn');
      const emojiContainer = document.getElementById('emojiPickerContainer');

      const callOverlay = document.getElementById('callOverlay');
      const incoming = document.getElementById('incoming');
      const answerBtn = document.getElementById('answerBtn');
      const declineBtn = document.getElementById('declineBtn');
      const remoteVideo = document.getElementById('remoteVideo');
      const localVideoEl = document.getElementById('localVideo');
      const hangupBtn = document.getElementById('hangupBtn');
      const muteBtn = document.getElementById('muteBtn');
      const cameraToggleBtn = document.getElementById('cameraToggleBtn');

      const openSnap = document.getElementById('openSnap');
      const snapArea = document.getElementById('snapArea');
      const snapVideo = document.getElementById('snapVideo');
      const captureBtn = document.getElementById('captureBtn');
      const sendSnapBtn = document.getElementById('sendSnapBtn');
      const closeSnapBtn = document.getElementById('closeSnapBtn');
      const snapCanvas = document.getElementById('snapCanvas');
      const themeToggle = document.getElementById('themeToggle');

      let localStream = null;
      let peer = null;
      let isCalling = false;
      let incomingSignalData = null;

      // Data URLs inflate the raw bytes by ~33%; keep the encoded payload under
      // the server's maxHttpBufferSize so oversized files fail loudly here
      // instead of dropping the socket connection mid-transfer.
      const MAX_ATTACHMENT_BYTES = 8 * 1024 * 1024;
      const ALLOWED_ATTACHMENT_TYPES = ['image/png','image/jpeg','image/gif','image/webp','application/pdf','text/plain'];

      // Attachments arrive from the peer, so only same-type base64 data URLs are
      // accepted; anything else (javascript:, data:text/html, remote URLs) is dropped.
      function safeAttachment(attachment){
        if(!attachment || typeof attachment !== 'object') return null;
        const { type, data, name } = attachment;
        if(typeof type !== 'string' || !ALLOWED_ATTACHMENT_TYPES.includes(type)) return null;
        if(typeof data !== 'string' || !data.startsWith(`data:${type};base64,`)) return null;
        if(!/^[A-Za-z0-9+/]+={0,2}$/.test(data.slice(`data:${type};base64,`.length))) return null;
        return { type, data, name: typeof name === 'string' ? name.slice(0, 40) : 'Attachment' };
      // Socket.IO's maxHttpBufferSize on the server; exceeding it closes the
      // transport with no error event, so nothing would report the loss.
      const MAX_EMIT_BYTES = 12 * 1024 * 1024;

      // Refuses to emit a payload the server transport would drop, and reports
      // it, instead of losing the message to a silent reconnect.
      function emitOrReport(event, payload, what){
        let size;
        try{
          size = new Blob([JSON.stringify(payload)]).size;
        }catch(err){
          reportError(`Could not send ${what}`, err);
          return false;
        }
        if(size >= MAX_EMIT_BYTES){
          reportError(`Could not send ${what}`, new Error(`Payload is too large (${Math.round(size / (1024*1024))} MB, max ${Math.round(MAX_EMIT_BYTES / (1024*1024))} MB)`));
          return false;
        }
        socket.emit(event, payload);
        return true;
      }

      function reportError(message, err){
        if(err) console.error(message, err);
        else console.error(message);
        alert(err && err.message ? `${message}: ${err.message}` : message);
      }

      // Emoji Picker Initialization
      let emojiPicker = null;
      if (window.picmo) {
        try {
          emojiPicker = picmo.createPicker({
            rootElement: emojiContainer,
            theme: 'dark'
          });
          emojiPicker.addEventListener('emoji:select', selection => {
            messageInput.value += selection.emoji;
            messageInput.focus();
          });
        } catch (err) {
          console.error('Emoji picker failed to initialize:', err);
        }
      } else {
        console.error('Emoji picker library (picmo) failed to load.');
      }

      bindDismissablePanel(emojiBtn, emojiContainer, () => {
        if(emojiPicker) return true;
        reportError('Emoji picker is unavailable — check your network connection and reload.');
        return false;
      });

      function appendMessage({ senderId, fromName, text='', attachment=null, ts=Date.now() }){
        const isMe = (senderId === socket.id);
        const el = document.createElement('div');
        el.className = 'msg ' + (isMe ? 'right' : 'left');

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${isMe ? 'You' : (fromName || 'Peer')} • ${new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        el.appendChild(meta);

        if(text){
          const p = document.createElement('div');
          p.textContent = text;
          el.appendChild(p);
        }

        const safe = safeAttachment(attachment);
        if(safe){
          if(safe.type.startsWith('image/')){
            const img = document.createElement('img');
            // An undecodable data URL would otherwise render as an empty bubble.
            img.onerror = () => {
              console.error('Attachment image failed to load:', attachment.name);
              const failed = document.createElement('div');
              failed.textContent = `\u26a0\ufe0f Image failed to load${attachment.name ? ` (${attachment.name})` : ''}`;
              failed.style.color = '#ff5b6f';
              img.replaceWith(failed);
            };
            img.src = attachment.data;
            el.appendChild(img);
          } else {
            const a = document.createElement('a');
            a.href = safe.data;
            a.textContent = safe.name || 'Attachment';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.download = safe.name || 'attachment';
            a.style.color = '#00ff9d';
            el.appendChild(a);
          }
        }

        chatBox.appendChild(el);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // Shared by the file-attach and snap-send paths.
      function sendAttachment(attachment){
        if(!socket.connected){
          throw new Error('Not connected to the chat server');
        }
        const ts = Date.now();
        socket.emit('send_message', { attachment, ts });
        appendMessage({ senderId: socket.id, attachment, ts });
      }

      function sendMessage(){
        const txt = (messageInput.value || '').trim();
        if(!txt) return;
        if(!socket.connected){
          reportError('Not connected to the chat server — your message was not sent.');
          return;
        }
        const payload = { text: txt, ts: Date.now() };
        if(!emitOrReport('send_message', payload, 'message')) return;
        appendMessage({ senderId: socket.id, text: txt, ts: payload.ts });
        messageInput.value = '';
        emojiContainer.classList.remove('active');
      }

      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          e.preventDefault();
          sendMessage();
        }
      });

      attachBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if(!file) return;
        try{
          if(file.size > MAX_ATTACHMENT_BYTES){
            throw new Error(`File is too large (max ${Math.round(MAX_ATTACHMENT_BYTES / (1024*1024))} MB)`);
          }
          const data = await readFileAsDataURL(file);
          sendAttachment({ name: file.name, type: file.type, data });
        }catch(err){
          reportError('Could not send attachment', err);
        }finally{
          fileInput.value = '';
        }
      });

      const toggleSnap = async () => {
        if(snapArea.style.display === 'flex'){
          closeSnap();
          return;
        }
        snapArea.style.display = 'flex';
        try{
          const s = await getMedia({ video: true, audio: false }, 'Camera');
          snapVideo.srcObject = s;
          snapArea._stream = s;
          await snapVideo.play();
        }catch(err){
          reportError('Camera error', err);
          closeSnap();
        }
      };

      openSnap.addEventListener('click', toggleSnap);
      camBtn.addEventListener('click', toggleSnap);

      captureBtn.addEventListener('click', () => {
        if(!snapVideo || !snapVideo.srcObject) return;
        const w = snapVideo.videoWidth || 640;
        const h = snapVideo.videoHeight || 480;
        snapCanvas.width = w;
        snapCanvas.height = h;
        try{
          const ctx = snapCanvas.getContext('2d');
          if(!ctx) throw new Error('2D canvas context is unavailable');
          ctx.drawImage(snapVideo, 0, 0, w, h);
          snapCanvas.hidden = false;
        }catch(err){
          snapCanvas.hidden = true;
          reportError('Could not capture the snap', err);
        }
      });

      sendSnapBtn.addEventListener('click', () => {
        if(snapCanvas.hidden) return alert('Capture a snap first!');
        try{
          const data = snapCanvas.toDataURL('image/png');
          sendAttachment({ name: 'snap.png', type: 'image/png', data });
          closeSnap();
        }catch(err){
          reportError('Could not send the snap', err);
        }
      });

      closeSnapBtn.addEventListener('click', closeSnap);

      function closeSnap(){
        stopStream(snapArea._stream);
        snapArea._stream = null;
        snapVideo.srcObject = null;
        snapCanvas.hidden = true;
        snapArea.style.display = 'none';
      }

      themeToggle.addEventListener('click', () => document.documentElement.classList.toggle('light'));

      socket.on('connect', () => {
        statusEl.textContent = 'online';
        statusEl.style.color = '#00ff9d';
      });

      socket.on('disconnect', (reason) => {
        console.warn('Disconnected from chat server:', reason);
        statusEl.textContent = 'offline';
        statusEl.style.color = '#ff5b6f';
        // The last known count is meaningless once we stop receiving updates.
        document.getElementById('myStatus').textContent = 'Online: —';
      });

      // Without these the connection can fail permanently while the UI still
      // reads "connecting..." and every send silently goes nowhere.
      socket.on('connect_error', (err) => {
        console.error('Chat server connection error:', err);
        statusEl.textContent = 'connection error';
        statusEl.style.color = '#ff5b6f';
      });

      socket.on('error', (err) => {
        console.error('Socket error:', err);
      });

      socket.io.on('reconnect_failed', () => {
        reportError('Lost connection to the chat server and could not reconnect. Please reload the page.');
      });

      socket.on('server_error', (info) => {
        reportError(`Server rejected '${info && info.event ? info.event : 'request'}'`, info && info.message ? new Error(info.message) : null);
      });

      socket.on('user_count_update', (count) => setText('myStatus', `Online: ${count}`));

      socket.on('receive_message', (payload) => {
        if(!payload || typeof payload !== 'object'){
          console.error('Ignoring malformed receive_message payload:', payload);
          return;
        }
        try{
          appendMessage({
            senderId: payload.from,
            fromName: payload.fromName,
            text: payload.text,
            attachment: payload.attachment,
            ts: payload.ts
          });
        }catch(err){
          console.error('Failed to render incoming message:', err, payload);
        }
      });

      const setCallState = (msg) => setText('callState', msg);

      // Shared by the outgoing-call button and the answer button; `onMediaError`
      // lets the answering side tell the caller it could not pick up.
      async function beginCall(initiator, state, onMediaError){
        try{
          localStream = await getMedia({ audio: true, video: true }, 'Camera/mic');
        }catch(err){
          if(onMediaError) onMediaError();
          reportError('Camera/Mic permission error', err);
          return;
        }
        try{
          localVideoEl.srcObject = localStream;
          showOverlay(callOverlay);
          if(state) setCallState(state);
          isCalling = true;
          startPeer(initiator);
        }catch(err){
          endCall();
          reportError(initiator ? 'Could not start the call' : 'Could not answer the call', err);
        }
      }

      startCallBtn.addEventListener('click', () => {
        if(isCalling) return;
        beginCall(true, 'Calling...');
      });

      socket.on('incoming_call', (data) => {
        if(!data || !data.signal){
          console.error('Ignoring incoming_call without a signal:', data);
          return;
        }
        incomingSignalData = data.signal;
        showOverlay(incoming);
        setText('incomingText', `${data.callerName || 'Peer'} is calling...`);
      });

      answerBtn.onclick = () => {
        hideOverlay(incoming);
        beginCall(false, null, () => {
          socket.emit('decline_call');
          endCall();
        });
      };

      declineBtn.onclick = () => {
        hideOverlay(incoming);
        socket.emit('decline_call');
      };

      socket.on('call_accepted', (signal) => {
        if(!peer){
          console.error('Received call_accepted with no active peer; ignoring signal.');
          setCallState('Call failed');
          return;
        }
        try{
          peer.signal(signal);
          setCallState('Connected');
        }catch(err){
          setCallState('Connection failed');
          reportError('Could not complete the call handshake', err);
          endCall();
        }
      });

      socket.on('call_ended', () => endCall());
      socket.on('call_declined', () => {
        alert('Call declined.');
        endCall();
      });

      // FIX: trickle set to false so SimplePeer emits ONE combined signal
      // (SDP + all ICE candidates) instead of many signal events over time.
      // Your socket events (call_user / incoming_call / answer_call /
      // call_accepted) only ever send/receive a single signal each, so with
      // trickle:true most of the connection info (ICE candidates found after
      // the first signal) was being silently dropped, which is why calls
      // would ring but never actually connect.
      function startPeer(initiator){
        if(typeof SimplePeer === 'undefined'){
          throw new Error('WebRTC library (simple-peer) failed to load');
        }
        peer = new SimplePeer({
          initiator: initiator,
          trickle: false,
          stream: localStream,
          config: peerConfig
        });

        peer.on('signal', data => {
          if(initiator){
            socket.emit('call_user', { signal: data, isVideo: true });
          } else {
            socket.emit('answer_call', { signal: data });
          }
        });

        if(!initiator){
          if(!incomingSignalData){
            throw new Error('Missing caller signal \u2014 the call offer was lost');
          }
          peer.signal(incomingSignalData);
        }

        peer.on('stream', stream => {
          remoteVideo.srcObject = stream;
          setCallState('Connected');
        });

        peer.on('error', err => {
          console.error('Peer error:', err);
          setCallState('Connection failed');
        });

        peer.on('close', () => endCall());
      }

      hangupBtn.addEventListener('click', () => {
        socket.emit('hangup');
        endCall();
      });

      muteBtn.addEventListener('click', () => toggleTrack(localStream, 'audio', muteBtn, '🎙️', '🔇'));
      cameraToggleBtn.addEventListener('click', () => toggleTrack(localStream, 'video', cameraToggleBtn, '📷', '🚫'));

      // FIX: clear the stale incoming signal on hangup so a later call
      // doesn't accidentally reuse an old/expired signal.
      function endCall(){
        if(peer){
          try{ peer.destroy(); }catch(err){ console.error('Failed to destroy peer connection:', err); }
          peer = null;
        }
        stopStream(localStream);
        localStream = null;
        incomingSignalData = null;
        remoteVideo.srcObject = null;
        localVideoEl.srcObject = null;
        isCalling = false;
        hideOverlay(callOverlay);
        hideOverlay(incoming);
      }

      /* ================= GAMES (multiplayer only — play with your chat partner) ================= */
      const moreBtn = document.getElementById('moreBtn');
      const moreMenu = document.getElementById('moreMenu');
      const openGamesBtn = document.getElementById('openGamesBtn');
      const gamesOverlay = document.getElementById('gamesOverlay');
      const gamesBackBtn = document.getElementById('gamesBackBtn');
      const gamesCloseBtn = document.getElementById('gamesCloseBtn');
      const gamesTitle = document.getElementById('gamesTitle');
      const gameScreens = document.querySelectorAll('.game-screen');

      bindDismissablePanel(moreBtn, moreMenu);

      function showGameScreen(id, title){
        gameScreens.forEach(s => s.classList.remove('active'));
        byId(id).classList.add('active');
        gamesTitle.textContent = title || 'Games';
        gamesBackBtn.classList.toggle('show', id !== 'gameLauncher');
      }

      openGamesBtn.addEventListener('click', () => {
        moreMenu.classList.remove('active');
        showOverlay(gamesOverlay);
        showGameScreen('gameLauncher', 'Games');
      });
      gamesCloseBtn.addEventListener('click', () => hideOverlay(gamesOverlay));
      gamesBackBtn.addEventListener('click', () => {
        showGameScreen('gameLauncher', 'Games');
      });

      document.querySelectorAll('.game-tile').forEach(tile => {
        tile.addEventListener('click', () => launchGame(tile.dataset.game));
      });

      function launchGame(game){
        if(game === 'ttt-multi'){ tttStart(); showGameScreen('gameTTT', 'Tic-Tac-Toe · vs Friend'); }
        else if(game === 'rps-multi'){ rpsStart(); showGameScreen('gameRPS', 'Rock Paper Scissors · vs Friend'); }
      }

      // --- Multiplayer relay ---
      // Mirrors the existing send_message -> receive_message pattern.
      // server.js relays these via: socket.on('send_game', d => socket.to('chat-room').emit('receive_game', d));
      function sendGame(type, data){
        if(!socket.connected){
          reportError('Not connected to the chat server \u2014 your friend will not see this move.');
          return;
        }
        socket.emit('send_game', { type, data, ts: Date.now() });
      }
      socket.on('receive_game', (payload) => {
        if(!payload || typeof payload.type !== 'string'){
          console.error('Ignoring malformed receive_game payload:', payload);
          return;
        }
        try{
          if(payload.type === 'ttt_move') tttOnRemoteMove(payload.data);
          else if(payload.type === 'ttt_reset') tttOnRemoteReset();
          else if(payload.type === 'rps_choice') rpsOnRemoteChoice(payload.data);
          else if(payload.type === 'rps_reset') rpsOnRemoteReset();
          else console.error('Unknown game event type:', payload.type);
        }catch(err){
          console.error(`Failed to apply game event '${payload.type}':`, err, payload);
        }
      });

      /* ---------- Tic Tac Toe (2-player only) ---------- */
      const tttBoardEl = document.getElementById('tttBoard');
      const tttStatusEl = document.getElementById('tttStatus');
      const tttResetBtn = document.getElementById('tttResetBtn');
      let tttBoard, tttTurn, tttMySymbol, tttOver;

      function tttReset(mySymbol, status){
        tttBoard = Array(9).fill(null);
        tttTurn = 'X';
        tttMySymbol = mySymbol;
        tttOver = false;
        tttRender();
        tttSetStatus(status);
      }

      function tttStart(){
        // whoever opens/starts the game is X, their friend is O
        tttReset('X', 'Your turn (X) — friend plays O');
        sendGame('ttt_reset', {});
      }

      function tttRender(){
        tttBoardEl.innerHTML = '';
        tttBoard.forEach((val, i) => {
          const cell = document.createElement('div');
          cell.className = 'ttt-cell' + (val === 'O' ? ' o' : '');
          cell.textContent = val || '';
          cell.addEventListener('click', () => tttHandleClick(i));
          tttBoardEl.appendChild(cell);
        });
      }

      function tttSetStatus(msg){ setText(tttStatusEl, msg); }

      // Renders the board and reports whether the game just ended.
      function tttAfterMove(){
        tttRender();
        const w = tttWinner(tttBoard);
        if(!w) return false;
        tttOver = true;
        tttSetStatus(w === 'draw' ? "It's a draw!" : `${w} wins!`);
        return true;
      }

      function tttWinner(board){
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(const [a,b,c] of lines){
          if(board[a] && board[a] === board[b] && board[b] === board[c]) return board[a];
        }
        if(board.every(v => v)) return 'draw';
        return null;
      }

      function tttHandleClick(i){
        if(tttOver || tttBoard[i]) return;
        if(tttTurn !== tttMySymbol) return; // not your turn
        tttBoard[i] = tttTurn;
        sendGame('ttt_move', { i, mark: tttTurn });
        if(tttAfterMove()) return;
        tttTurn = tttTurn === 'X' ? 'O' : 'X';
        tttSetStatus("Friend's turn");
      }

      function tttOnRemoteMove(data){
        if(!data || !Number.isInteger(data.i) || data.i < 0 || data.i > 8 || (data.mark !== 'X' && data.mark !== 'O')){
          throw new Error(`Invalid tic-tac-toe move: ${JSON.stringify(data)}`);
        }
        if(!tttBoard) tttOnRemoteReset();
        tttBoard[data.i] = data.mark;
        if(tttAfterMove()) return;
        tttTurn = data.mark === 'X' ? 'O' : 'X';
        tttSetStatus(tttTurn === tttMySymbol ? 'Your turn' : "Friend's turn");
      }

      function tttOnRemoteReset(){
        // whoever receives the reset plays O
        tttReset('O', "Friend's turn (X)");
      }

      tttResetBtn.addEventListener('click', tttStart);

      /* ---------- Rock Paper Scissors (2-player only) ---------- */
      const rpsChoicesEl = document.getElementById('rpsChoices');
      const rpsResultEl = document.getElementById('rpsResult');
      const rpsStatusEl = document.getElementById('rpsStatus');
      const rpsResetBtn = document.getElementById('rpsResetBtn');
      let rpsMyChoice, rpsOppChoice;
      const RPS_EMOJI = { rock: '✊', paper: '✋', scissors: '✌️' };
      const rpsButtons = () => rpsChoicesEl.querySelectorAll('.rps-choice');
      const rpsSetChoicesDisabled = (disabled) => rpsButtons().forEach(b => b.disabled = disabled);

      function rpsStart(){
        rpsMyChoice = null;
        rpsOppChoice = null;
        rpsResultEl.innerHTML = '';
        rpsSetChoicesDisabled(false);
        rpsSetStatus('Pick your move — waiting for your friend too');
      }

      function rpsSetStatus(msg){ setText(rpsStatusEl, msg); }

      rpsButtons().forEach(btn => {
        btn.addEventListener('click', () => {
          if(rpsMyChoice) return;
          rpsMyChoice = btn.dataset.choice;
          rpsSetChoicesDisabled(true);
          sendGame('rps_choice', { choice: rpsMyChoice });
          rpsSetStatus('Waiting for your friend...');
          rpsMaybeReveal();
        });
      });

      function rpsMaybeReveal(){
        if(rpsMyChoice && rpsOppChoice) rpsReveal('Friend');
      }

      function rpsOnRemoteChoice(data){
        if(!data || !Object.prototype.hasOwnProperty.call(RPS_EMOJI, data.choice)){
          throw new Error(`Invalid rock-paper-scissors choice: ${JSON.stringify(data)}`);
        }
        rpsOppChoice = data.choice;
        rpsMaybeReveal();
      }

      function rpsWinnerText(mine, theirs){
        if(mine === theirs) return "It's a tie!";
        const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
        return beats[mine] === theirs ? 'You win! 🎉' : 'You lose!';
      }

      function rpsReveal(oppLabel){
        rpsResultEl.textContent = '';
        const side = (emoji, label) => {
          const wrap = document.createElement('div');
          wrap.textContent = emoji;
          const caption = document.createElement('div');
          caption.className = 'rps-vs';
          caption.textContent = label;
          wrap.appendChild(caption);
          return wrap;
        };
        const vs = document.createElement('div');
        vs.className = 'rps-vs';
        vs.textContent = 'vs';
        rpsResultEl.appendChild(side(RPS_EMOJI[rpsMyChoice], 'You'));
        rpsResultEl.appendChild(vs);
        rpsResultEl.appendChild(side(RPS_EMOJI[rpsOppChoice], oppLabel));
        rpsSetStatus(rpsWinnerText(rpsMyChoice, rpsOppChoice));
      }

      function rpsOnRemoteReset(){
        rpsStart();
      }

      rpsResetBtn.addEventListener('click', () => {
        sendGame('rps_reset', {});
        rpsStart();
      });
      /* ================= END GAMES ================= */
    });
  })();
  </script>
</body>
</html>
